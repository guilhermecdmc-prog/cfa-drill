  --ink:#1B2434; --muted:#5C6A80; --faint:#8593A9; --line:#E2E7EF; --line-2:#D4DBE6;
  --ok:#1E9E63; --ok-soft:#E4F5EC; --bad:#D9435F; --bad-soft:#FBE9ED;
  --amber:#8A6A1B; --amber-soft:#F9EFD4; --amber-line:#E8D294;
  --shadow:0 1px 2px rgba(27,36,52,.05),0 8px 24px -12px rgba(27,36,52,.12);
  --shadow-lg:0 2px 4px rgba(27,36,52,.06),0 16px 40px -16px rgba(27,36,52,.18);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,'Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1322; --bg-soft:#101a2c; --card:#141F33; --card-2:#182540;
  --ink:#E8EEF9; --muted:#8CA0BF; --faint:#61748f; --line:#233350; --line-2:#2C3E5F;
  --ok:#3DD68C; --ok-soft:rgba(61,214,140,.12); --bad:#FF6B87; --bad-soft:rgba(255,107,135,.12);
  --amber:#F2C74B; --amber-soft:rgba(242,199,75,.12); --amber-line:rgba(242,199,75,.4);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0B1322; --bg-soft:#101a2c; --card:#141F33; --card-2:#182540;
  --ink:#E8EEF9; --muted:#8CA0BF; --faint:#61748f; --line:#233350; --line-2:#2C3E5F;
  --ok:#3DD68C; --ok-soft:rgba(61,214,140,.12); --bad:#FF6B87; --bad-soft:rgba(255,107,135,.12);
  --amber:#F2C74B; --amber-soft:rgba(242,199,75,.12); --amber-line:rgba(242,199,75,.4);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  --bg:#F3F5F8; --bg-soft:#EBEEF4; --card:#FFFFFF; --card-2:#F7F9FC;
  --ink:#1B2434; --muted:#5C6A80; --faint:#8593A9; --line:#E2E7EF; --line-2:#D4DBE6;
  --ok:#1E9E63; --ok-soft:#E4F5EC; --bad:#D9435F; --bad-soft:#FBE9ED;
  --amber:#8A6A1B; --amber-soft:#F9EFD4; --amber-line:#E8D294;
  --shadow:0 1px 2px rgba(27,36,52,.05),0 8px 24px -12px rgba(27,36,52,.12);
  --shadow-lg:0 2px 4px rgba(27,36,52,.06),0 16px 40px -16px rgba(27,36,52,.18);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.wrap{max-width:680px;margin:0 auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom))}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h1{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.12;margin:6px 0 4px;text-wrap:balance}
h2{font-family:var(--disp);font-weight:800;font-size:21px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14.5px;margin:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tap{transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.tap:active{transform:scale(.985)}

/* ---------- home ---------- */
.stats-row{display:flex;gap:10px;margin:18px 0 6px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .n{font-family:var(--mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:16px;margin-top:12px}
.bigbtn .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:15px}
.bigbtn .t{font-weight:600;font-size:16px}
.bigbtn .d{font-size:13px;color:var(--muted);margin-top:1px}
.bigbtn .chev{margin-left:auto;color:var(--faint);flex:none}
.sess{margin-top:26px}
.sess-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px}
.sess-head .dot{width:10px;height:10px;border-radius:4px;flex:none;position:relative;top:-1px}
.sess-head h3{font-family:var(--disp);font-weight:800;font-size:16px;margin:0}
.sess-head .cnt{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:auto}
.topic-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:14px;margin-top:8px}
.topic-btn .t{font-weight:600;font-size:15.5px}
.topic-btn .d{font-size:12.5px;color:var(--muted);margin-top:1px}
.topic-btn .m{margin-left:auto;text-align:right;flex:none}
.topic-btn .pct{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.topic-btn .pl{font-size:10.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* ---------- topic setup ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:500;padding:6px 2px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--card);font-size:14px;font-weight:500;transition:all .15s ease}
.chip .n{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--ink)}
.chip.on .n{color:var(--acc-ink)}
.sizes{display:flex;gap:8px;margin-top:12px}
.size{flex:1;text-align:center;padding:11px 0;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);font-family:var(--mono);font-weight:600;font-size:14.5px;transition:all .15s ease}
.size.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-ink)}
.label{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:22px}
.start{display:block;width:100%;text-align:center;padding:15px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;margin-top:24px;box-shadow:var(--shadow-lg)}
.start:disabled{opacity:.4;cursor:default}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qbar .track{flex:1;height:6px;border-radius:3px;background:var(--bg-soft);overflow:hidden}
.qbar .fill{height:100%;border-radius:3px;background:var(--acc);transition:width .3s ease}
.qbar .pos{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.qbar .exit{flex:none;font-size:13px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:8px;border:1px solid var(--line-2)}
.qcard{padding:20px;border-radius:18px}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qtag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:var(--acc-soft);color:var(--acc-ink)}
.qtext{font-size:17.5px;line-height:1.5;font-weight:550;margin:12px 0 0;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line-2);background:var(--card-2);font-size:15px;line-height:1.45;transition:border-color .15s ease,background .15s ease}
.opt .key{flex:none;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--faint);width:18px;padding-top:1px}
.opt:not(:disabled):hover{border-color:var(--acc)}
.verdict{display:flex;align-items:center;gap:10px;margin-top:18px;font-family:var(--disp);font-weight:800;font-size:19px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.verdict .vc{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.verdict.ok .vc{background:var(--ok-soft)} .verdict.bad .vc{background:var(--bad-soft)}
.explain{margin-top:12px;padding:15px 16px;border-radius:13px;background:var(--card-2);border:1px solid var(--line);font-size:15px;line-height:1.55;color:var(--ink)}
.explain .why{white-space:pre-wrap}
.badge{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 12px;border-radius:9px;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);font-size:13px;font-weight:600}
.recap{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.recap .row{display:flex;gap:10px;align-items:baseline;padding:9px 13px;border-radius:11px;font-size:14px;border:1px solid transparent}
.recap .who{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;flex:none;width:58px}
.recap .you-bad{background:var(--bad-soft);color:var(--bad)}
.recap .ans-ok{background:var(--ok-soft);color:var(--ok)}
.nextbar{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent)}
.next{display:block;width:100%;text-align:center;padding:15px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;box-shadow:var(--shadow-lg)}
.figrow{display:flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap}
.figbox{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.figbox .cap{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}

/* ---------- results ---------- */
.res-hero{text-align:center;padding:30px 20px 24px}
.ring{position:relative;width:130px;height:130px;margin:0 auto}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:30px}
.res-sub{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.res-line{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
.res-line .nm{font-weight:600}
.res-line .sc{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row-btns{display:flex;gap:10px;margin-top:22px}
.row-btns .b{flex:1;text-align:center;padding:14px;border-radius:13px;font-weight:700;font-size:15px}
.b.solid{background:var(--ink);color:var(--bg)}
.b.ghost{border:1.5px solid var(--line-2);background:var(--card)}

/* ---------- lock ---------- */
.lockwrap{max-width:380px;margin:12vh auto 0;text-align:center}
.lockform{margin-top:22px;text-align:left}
.lockinput{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);font-size:15px;font-family:var(--mono)}
.lockinput:focus{outline:none;border-color:var(--ink)}
.lockmsg{margin-top:10px;font-size:13.5px;color:var(--bad);min-height:18px;text-align:center}

/* ---------- performance ---------- */
.perf-row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:13px;margin-top:8px}
.perf-row .pdot{width:9px;height:9px;border-radius:3.5px;flex:none}
.perf-row .pmain{min-width:0;flex:1.4;display:flex;flex-direction:column}
.perf-row .pn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf-row .pt{font-size:11.5px;color:var(--faint)}
.perf-row .pbar{flex:1;min-width:60px}
.bar{display:block;height:7px;border-radius:4px;background:var(--bg-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.perf-row .ppct{font-family:var(--mono);font-weight:600;font-size:13px;width:40px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.days{display:flex;gap:5px;align-items:flex-end}
.day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:center}
.day b{display:block;border-radius:3px 3px 0 0;margin:0 auto;width:70%;max-width:22px}
.day span{font-family:var(--mono);font-size:9px;color:var(--faint)}

.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none}
</style>

function ghUrl() { return `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`; }
function ghHeaders() {
  return { Authorization: "Bearer " + ghToken(), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
}
async function ghGet() {
  const r = await fetch(ghUrl(), { headers: ghHeaders() });
  if (r.status === 404) return { sha: null, doc: null };
  if (!r.ok) throw new Error("GitHub " + r.status + (r.status === 401 ? " (check the token)" : ""));
  const j = await r.json();
  const doc = JSON.parse(new TextDecoder().decode(b64d(j.content.replace(/\n/g, ""))));
  return { sha: j.sha, doc };
}
async function ghPut(doc, sha) {
  const body = { message: "sync " + new Date().toISOString(), content: b64e(new TextEncoder().encode(JSON.stringify(doc))) };
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(), { method: "PUT", headers: ghHeaders(), body: JSON.stringify(body) });
  if (!r.ok) throw new Error("GitHub " + r.status);
}
async function syncNow() {
  if (!ghToken() || SYNC.busy || !navigator.onLine) return;
  SYNC.busy = true; SYNC.status = "Syncing&hellip;";
  if (S.screen === "perf") render();
  try {
    const { sha, doc } = await ghGet();
    const lup = store.get(K_LUP) || 0;
    const rup = (doc && doc.updatedAt) || 0;
    if (rup > lup) {
      S.missed = doc.missed || {};
      S.seen = doc.seen || {};
      S.stats = { t: (doc.stats && doc.stats.t) || {}, s: (doc.stats && doc.stats.s) || {}, h: (doc.stats && doc.stats.h) || [] };
      store.set(K_MISSED, S.missed); store.set(K_SEEN, S.seen); store.set(K_STATS, S.stats); store.set(K_LUP, rup);
      SYNC.status = "Pulled latest progress";
    } else if (lup > rup) {
      await ghPut({ v: 2, updatedAt: lup, missed: S.missed, seen: S.seen, stats: S.stats }, sha);
      SYNC.status = "Pushed this device's progress";
    } else SYNC.status = "Up to date";
    SYNC.last = Date.now();
  } catch (e) { SYNC.status = "Sync failed: " + esc(e.message); }
  SYNC.busy = false;
  if (S.screen === "perf" || S.screen === "home") render();
}
function syncPull() { syncNow(); }

function bumpStats(topicKey, sub, ok) {
  if (!topicKey) return;
  markDirty();
  const st = S.stats;
  const bump = (o, k) => { const v = o[k] || { a: 0, c: 0 }; v.a++; if (ok) v.c++; o[k] = v; };
  bump(st.t, topicKey);
  if (sub) bump(st.s, topicKey + "|" + sub);
  const day = new Date().toISOString().slice(0, 10);
  let last = st.h[st.h.length - 1];
  if (!last || last.d !== day) { last = { d: day, a: 0, c: 0 }; st.h.push(last); if (st.h.length > 90) st.h = st.h.slice(-90); }
  last.a++; if (ok) last.c++;
  store.set(K_STATS, st);
}
function acc(v) { return v && v.a ? Math.round(100 * v.c / v.a) : null; }
function accColor(p) { return p >= 75 ? "var(--ok)" : p >= 50 ? "#E0A63A" : "var(--bad)"; }
function weakSubs() {
  const out = [];
  for (const k in S.stats.s) {
    const v = S.stats.s[k];
    if (v.a >= 3 && acc(v) < 75) {
      const [tk, sub] = k.split("|");
      const t = topicByKey(tk);
      if (t && t.bank.some(q => q.sub === sub)) out.push({ key: k, tk, sub, topic: t, a: v.a, pct: acc(v) });
    }
  }
  return out.sort((x, y) => x.pct - y.pct);
}

/* ════════ SVG (signature elements, ported) ════════ */
function waveSVG(active) {
  const W = 340, H = 74, MID = H / 2, AMP = 21, PAD = 10;
  const px = t => PAD + t * (W - 2 * PAD), py = t => MID + Math.cos(2 * Math.PI * t) * AMP;
  let d = `M ${px(0)} ${py(0)}`;
  for (let i = 1; i <= 120; i++) d += ` L ${px(i / 120).toFixed(1)} ${py(i / 120).toFixed(1)}`;
  let dots = "";
  for (const k of PHASE_ORDER) {
    const p = PHASES[k], on = active === k, cx = px(p.x).toFixed(1), cy = py(p.x).toFixed(1);
    dots += `<circle cx="${cx}" cy="${cy}" r="${on ? 6.5 : 3.2}" fill="${on ? p.color : "var(--faint)"}"></circle>`;
    if (on) dots += `<circle cx="${cx}" cy="${cy}" r="12" fill="none" stroke="${p.color}" stroke-width="1.2" opacity=".45"><animate attributeName="r" from="7" to="16" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" from=".5" to="0" dur="1.4s" repeatCount="indefinite"/></circle>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:230px;max-width:100%" aria-hidden="true"><line x1="${PAD}" y1="${MID}" x2="${W - PAD}" y2="${MID}" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="3 4"/><path d="${d}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" opacity=".55"/>${dots}</svg>`;
}
function curveSVG(phaseKey) {
  const p = PHASES[phaseKey], W = 116, H = 54, PAD = 8;
  const xs = p.curve.map((_, i) => PAD + (i / 3) * (W - 2 * PAD));
  const ys = p.curve.map(v => H - PAD - v * (H - 2 * PAD));
  const d = xs.map((x, i) => `${i ? "L" : "M"} ${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" ");
  const dots = xs.map((x, i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2" fill="${p.color}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:116px" aria-hidden="true"><line x1="${PAD}" y1="${H - PAD}" x2="${W - PAD}" y2="${H - PAD}" stroke="var(--line-2)" stroke-width="1"/><path d="${d}" fill="none" stroke="${p.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${dots}<text x="${PAD}" y="${H - 1}" fill="var(--faint)" font-size="7" font-family="var(--mono)">2y</text><text x="${W - PAD - 9}" y="${H - 1}" fill="var(--faint)" font-size="7" font-family="var(--mono)">30y</text></svg>`;
}

/* ════════ RENDER ════════ */
const root = document.getElementById("root");
function render() { setAccent(root); root.innerHTML = { lock: rLock, home: rHome, topic: rTopic, quiz: rQuiz, done: rDone, perf: rPerf }[S.screen](); wire(); window.scrollTo(0, 0); }

function rLock() {
  const insecure = !(window.crypto && crypto.subtle);
  return `<div class="fade lockwrap">
    <div class="eyebrow">Level III</div>
    <h1>CFA Drill</h1>
    <p class="sub">This question bank is encrypted. Enter the passphrase to unlock it on this device.</p>
    ${insecure
      ? `<div class="explain" style="margin-top:18px">This page needs a secure context (https or localhost) to decrypt. Open it from the published URL.</div>`
      : `<form class="lockform" data-form="unlock">
          <input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" class="lockinput" autofocus>
          <button class="start tap" style="margin-top:12px;background:var(--ink);color:var(--bg)" type="submit">Unlock</button>
          <div id="lockmsg" class="lockmsg"></div>
        </form>`}
  </div>`;
}

function totalQ() { return Object.keys(ALL_Q).length; }
function overallStats() {
  let a = 0, c = 0;
  for (const k in S.stats.t) { a += S.stats.t[k].a; c += S.stats.t[k].c; }
  return { a, c, pct: a ? Math.round(100 * c / a) : null };
}

        <span class="m">${pct === null ? `<span class="pl">new</span>` : `<span class="pct" style="color:${pct >= 75 ? "var(--ok)" : pct >= 50 ? s.accent : "var(--bad)"}">${pct}%</span><br><span class="pl">${st.a} seen</span>`}</span></button>`;

function poolOf(t) {
  const inSel = t.bank.filter(q => S.sel.includes(q.sub));
  if (S.qmode === "unseen") return inSel.filter(q => !S.seen[q.id]);
  if (S.qmode === "missed") return inSel.filter(q => S.missed[q.id]);
  return inSel;
}
function rTopic() {
  const t = S.topic, subs = subsOf(t.bank);
  const inSel = t.bank.filter(q => S.sel.includes(q.sub));
  const counts = {
    all: inSel.length,
    unseen: inSel.filter(q => !S.seen[q.id]).length,
    missed: inSel.filter(q => S.missed[q.id]).length,
  };
  const nPool = poolOf(t).length;
  let h = `<div class="fade">
    <button class="back" data-act="home">&lsaquo; Home</button>
    <div class="eyebrow" style="color:var(--acc-ink)">${esc(S.session.name)}</div>
    <h1 style="font-size:26px">${esc(t.name)}</h1>
    <p class="sub">${t.bank.length} questions in the bank. Pick what to drill.</p>
    <div class="label">Subtopics</div><div class="chips">`;
  for (const sub of subs) {
    const n = t.bank.filter(q => q.sub === sub).length;
    h += `<button class="chip tap ${S.sel.includes(sub) ? "on" : ""}" data-sub="${esc(sub)}">${esc(sub)} <span class="n">${n}</span></button>`;
  }
  h += `</div><div class="label">Questions</div><div class="chips">`;
  for (const [m, lbl] of [["all", "All"], ["unseen", "Unseen"], ["missed", "Missed"]]) {
    h += `<button class="chip tap ${S.qmode === m ? "on" : ""}" data-qmode="${m}" ${counts[m] ? "" : "disabled style='opacity:.45'"}>${lbl} <span class="n">${counts[m]}</span></button>`;
  }
  h += `</div><div class="label">How many</div><div class="sizes">`;
  for (const z of SIZES) h += `<button class="size tap ${S.size === z ? "on" : ""}" data-size="${z}">${z === 0 ? "All" : z}</button>`;
  h += `</div><button class="start tap" data-act="start" ${nPool ? "" : "disabled"}>Start &middot; ${S.size === 0 ? nPool : Math.min(S.size, nPool)} questions</button></div>`;
  return h;
}

function rQuiz() {

  let h = `<div class="fade">
    <div class="qbar">
      <button class="exit tap" data-act="exit">Save &amp; exit</button>

    </div>

      <div class="qmeta"><span class="qtag">${esc(S.isReview ? topicName : q.sub)}</span>${S.isReview ? `<span class="qtag" style="background:var(--bg-soft);color:var(--muted)">${esc(q.sub)}</span>` : ""}</div>
      <p class="qtext">${esc(q.q)}</p>`;

  if (!answered) {
    h += `<div class="opts">`;
    q.opts.forEach((o, ix) => {
      const key = q.opts.length === 2 && q.opts[0] === "True" ? (ix ? "F" : "T") : String.fromCharCode(65 + ix);

      h += `<button class="opt tap" data-pick="${ix}" ${col}><span class="key">${key}</span><span>${esc(o)}</span></button>`;
    });
    h += `</div>`;
  } else {
    const ok = S.picked === q.ans;
    h += `<div class="verdict ${ok ? "ok" : "bad"}"><span class="vc">${ok ? "&#10003;" : "&#10007;"}</span>${ok ? "Correct" : "Not quite"}</div>`;

    if (q.phase) {
      h += `<div class="figrow"><div class="figbox"><div class="cap">cycle</div>${waveSVG(q.phase)}</div><div class="figbox"><div class="cap">yield curve &middot; ${esc(PHASES[q.phase].label)}</div>${curveSVG(q.phase)}</div></div>`;

  return h + `</div>`;
}

function rDone() {
  const n = S.log.length, c = S.log.filter(x => x.ok).length;
  const pct = n ? Math.round(100 * c / n) : 0;
  const R = 56, CIRC = 2 * Math.PI * R;
  const col = pct >= 75 ? "var(--ok)" : pct >= 50 ? "var(--acc)" : "var(--bad)";
  let h = `<div class="fade"><div class="res-hero">
    <div class="eyebrow">${esc(S.deckLabel || (S.topic ? S.topic.name : ""))}</div>

      <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--bg-soft)" stroke-width="10"/>
      <circle cx="65" cy="65" r="${R}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${(CIRC * pct / 100).toFixed(1)} ${CIRC.toFixed(1)}" transform="rotate(-90 65 65)"/>
    </svg><div class="num">${pct}%</div></div>
    <p class="sub" style="margin-top:14px">${c} of ${n} correct</p></div>`;
  const bySub = {};
  S.log.forEach(x => { const q = ALL_Q[x.id]; if (!q) return; const k = S.isReview ? (Q_TOPIC[x.id] || q.sub) : q.sub; (bySub[k] = bySub[k] || { a: 0, c: 0 }); bySub[k].a++; if (x.ok) bySub[k].c++; });

  return h;
}

      <form data-form="ghsave" style="display:flex;gap:8px;margin-top:10px">

  }
  h += `<button class="back" style="margin-top:20px;color:var(--faint);font-size:12.5px" data-act="resetstats">Reset statistics</button></div>`;
  return h;
}

/* ════════ ACTIONS ════════ */
function begin() {
  const pool = shuffle(poolOf(S.topic));
  if (!pool.length) return;
  S.deck = S.size ? pool.slice(0, S.size) : pool;
  S.i = 0; S.picked = null; S.log = []; S.isReview = false; S.deckLabel = S.topic.name; S.screen = "quiz";
  saveResume(); render();
}
function beginReview() {
  const pool = shuffle(missedIds().map(id => ALL_Q[id]));
  if (!pool.length) return;
  S.session = null; S.topic = null;
  S.deck = S.size && S.size < pool.length ? pool.slice(0, S.size) : pool;
  S.i = 0; S.picked = null; S.log = []; S.isReview = true; S.deckLabel = "Review of missed"; S.screen = "quiz";
  saveResume(); render();
}
function beginWeak() {
  const seen = new Set();
  let pool = [];
  for (const w of weakSubs()) w.topic.bank.forEach(q => { if (q.sub === w.sub && !seen.has(q.id)) { seen.add(q.id); pool.push(q); } });
  missedIds().forEach(id => { if (!seen.has(id)) { seen.add(id); pool.push(ALL_Q[id]); } });
  if (!pool.length) return;
  S.session = null; S.topic = null;
  S.deck = shuffle(pool).slice(0, 20);
  S.i = 0; S.picked = null; S.log = []; S.isReview = true; S.deckLabel = "Weak areas drill"; S.screen = "quiz";
  saveResume(); render();
}
function doResume() {
  const r = S.resume;
  const qs = r.ids.map(id => ALL_Q[id]).filter(Boolean);
  if (!qs.length) { S.resume = null; store.del(K_RESUME); render(); return; }
  S.session = SESSIONS.find(x => x.key === r.sessionKey) || null;
  S.topic = S.session ? S.session.topics.find(x => x.key === r.topicKey) || null : null;
  if (r.sel) S.sel = r.sel;
  S.isReview = !!r.review; S.deckLabel = r.label || "";
  S.deck = qs; S.i = Math.min(r.i, qs.length - 1); S.log = r.log || [];
  S.picked = null; S.screen = "quiz"; render();
}
function pick(ix) {
  if (S.picked !== null) return;
  const q = S.deck[S.i];
  S.picked = ix;
  const ok = ix === q.ans;
  S.log.push({ id: q.id, ok });
  S.seen[q.id] = 1; store.set(K_SEEN, S.seen);
  bumpStats(S.isReview ? keyOfTopicName(Q_TOPIC[q.id]) : (S.topic ? S.topic.key : null), q.sub, ok);
  if (ok) { if (S.missed[q.id]) { delete S.missed[q.id]; store.set(K_MISSED, S.missed); } }
  else { S.missed[q.id] = Date.now(); store.set(K_MISSED, S.missed); }
  saveResume(); render();
}
function keyOfTopicName(name) { for (const s of SESSIONS) for (const t of s.topics) if (t.name === name) return t.key; return null; }
function next() {
  if (S.i + 1 < S.deck.length) { S.i++; S.picked = null; saveResume(); render(); }
  else { S.resume = null; store.del(K_RESUME); S.screen = "done"; render(); syncNow(); }
}
function exitSave() { saveResume(); S.resume = store.get(K_RESUME); S.screen = "home"; render(); syncNow(); }

function wire() {
  root.querySelectorAll("[data-act]").forEach(el => el.addEventListener("click", () => {
    const a = el.dataset.act;
    if (a === "home") { S.screen = "home"; S.resume = (() => { const r = store.get(K_RESUME); return r && r.ids && r.ids.length ? r : null; })(); render(); }
    else if (a === "resume") doResume();
    else if (a === "review") { S.size = 0; beginReview(); }
    else if (a === "start") begin();
    else if (a === "next") next();
    else if (a === "exit") exitSave();
    else if (a === "perf") { S.screen = "perf"; render(); }
    else if (a === "weak") beginWeak();
    else if (a === "resetstats") { if (confirm("Reset all statistics? The missed bank is kept.")) { S.stats = { t: {}, s: {}, h: [] }; store.set(K_STATS, S.stats); markDirty(); render(); } }
    else if (a === "syncnow") syncNow();
    else if (a === "ghdel") { store.del(K_GH); SYNC = { status: "", last: null, busy: false }; render(); }
  }));
  root.querySelectorAll("[data-topic]").forEach(el => el.addEventListener("click", () => {
    const t = topicByKey(el.dataset.topic);
    S.session = sessionOf(el.dataset.topic); S.topic = t; S.sel = subsOf(t.bank); S.qmode = "all"; S.screen = "topic"; render();
  }));
  root.querySelectorAll("[data-qmode]").forEach(el => el.addEventListener("click", () => { S.qmode = el.dataset.qmode; render(); }));
  root.querySelectorAll("[data-sub]").forEach(el => el.addEventListener("click", () => {
    const sub = el.dataset.sub;
    S.sel = S.sel.includes(sub) ? S.sel.filter(x => x !== sub) : [...S.sel, sub];
    render();
  }));
  root.querySelectorAll("[data-size]").forEach(el => el.addEventListener("click", () => { S.size = +el.dataset.size; render(); }));
  root.querySelectorAll("[data-pick]").forEach(el => el.addEventListener("click", () => pick(+el.dataset.pick)));
  const lockForm = root.querySelector('[data-form="unlock"]');
  if (lockForm) lockForm.addEventListener("submit", async e => {
    e.preventDefault();
    const msg = document.getElementById("lockmsg"), pass = document.getElementById("pass").value;
    if (!pass) return;
    msg.textContent = "Unlocking…";
    try { boot(await unlockWithPass(pass)); }
    catch { msg.textContent = "Wrong passphrase. Try again."; }
  });
  const ghForm = root.querySelector('[data-form="ghsave"]');
  if (ghForm) ghForm.addEventListener("submit", e => {
    e.preventDefault();
    const tok = document.getElementById("ghtok").value.trim();
    if (!tok) return;
    store.set(K_GH, { token: tok });
    SYNC.status = ""; render(); syncNow();
  });
}

document.addEventListener("keydown", e => {
  if (S.screen !== "quiz") return;
  const q = S.deck[S.i];
  if (S.picked === null) {
    const k = e.key.toUpperCase();
    if (q.opts.length === 2 && q.opts[0] === "True") { if (k === "T") pick(0); if (k === "F") pick(1); }
    const n = "ABCDE".indexOf(k);
    if (n >= 0 && n < q.opts.length) pick(n);
    const d = "12345".indexOf(e.key);
    if (d >= 0 && d < q.opts.length) pick(d);
  } else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(); }
});

render();
(async () => {
  if (!(window.crypto && crypto.subtle)) return;
  const data = await unlockWithCachedKey();
  if (data) boot(data);
})();

// re-sync when the app comes back to the foreground (home-screen app resume, tab switch)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (S.screen === "lock" || S.screen === "quiz") return;   // never mid-question
  if (SYNC.last && Date.now() - SYNC.last < 30000) return;  // debounce
  syncNow();
});
</script>
